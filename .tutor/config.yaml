# Generated by /tutor:init — edit freely
project:
  summary: "Fractured Entangled Representations using CPPNs and KANs, ported from JAX to PyTorch"

audience:
  profile: "Solo developer learning PyTorch by porting a JAX/Flax reference implementation"
  technical_level: intermediate
  assumed_knowledge:
    - neural network theory (architecture, backprop, loss functions)
    - KAN math (spline functions, Kolmogorov-Arnold theorem)
    - CPPN concepts (coordinate-based networks, pattern generation)
    - swarm/memetic algorithms and evolutionary computation
    - NumPy array operations
    - linear algebra / matrix math
    - Python (general fluency)

focus:
  conceptual: heavy         # "States what we're building" + "Explains every new concept"
  design_choices: heavy     # "Why PyTorch does it that way" + engineering reasons
  implementation: heavy     # Line-by-line annotated code is the core output
  connections: normal       # "Math vs PyTorch" tables, NumPy equivalents
  examples: heavy           # "Minimal isolated example (3-10 lines)" per concept

triggers:
  mode: pre                 # Tutorial-first: write tutorial before implementation code

output:
  directory: tutorials/
  style: narrative          # "First we... then we... because..."
  naming: "{nn}_{slug}.md"  # matches existing: 01_pytorch_foundations_for_cppns.md
  frontmatter: true
  frontmatter_fields:
    - date
    - summary

conventions:
  # These mirror the original CLAUDE.md tutorial rules
  math_vs_pytorch: true           # Always show "what this looks like in math" vs PyTorch
  numpy_equivalents: true         # If a PyTorch concept has a NumPy equivalent, mention it
  bold_key_insights: true         # Bold the **key insight** in each section
  isolated_snippets: true         # Keep code snippets short (3-10 lines) and runnable
  annotated_code_format: true     # Use CONCEPT/WHY comment format in code walkthroughs
  gotchas_section: true           # Call out counterintuitive or easy-to-mess-up things
  analogies_to_known: true        # Use analogies to math, ML theory, NumPy

presets:
  quick:
    focus_override:
      conceptual: light
      implementation: light
      design_choices: skip
    length: brief
  deep-dive:
    focus_override:
      conceptual: heavy
      design_choices: heavy
      implementation: heavy
      connections: heavy
      examples: heavy
    length: comprehensive
  line-by-line:
    focus_override:
      implementation: heavy
      examples: heavy
      conceptual: normal
    length: comprehensive
